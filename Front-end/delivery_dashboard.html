<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات التوصيل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-20">
    <header class="bg-zinc-900 border-b border-amber-900/30 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-amber-500">🚗 لوحة التوصيل</h1>
            <p class="text-[10px] text-zinc-500">الطلبات الجاهزة للخروج</p>
        </div>
        <button onclick="location.href='delivery_login.html'" class="text-xs bg-zinc-800 px-3 py-2 rounded-lg">خروج</button>
    </header>

    <main id="delivery-orders" class="p-4 space-y-4">
        <div class="text-center py-20 text-zinc-600">جاري تحميل الطلبات...</div>
    </main>

    <!-- ملفات التهيئة والبرمجة -->
    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_delivery.js"></script>
    <script>
        // حماية الصفحة
        if (sessionStorage.getItem('delivery_auth') !== 'true') {
            window.location.href = 'delivery_login.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof startDeliverySystem === 'function') startDeliverySystem();
        });
    </script>
</body>
</html>
