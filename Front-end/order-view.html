<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الطلب | مقهى السعادة</title>
    <script src="https://cdn.tailwindcss.com?v=16"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=16"></script>
    <script src="../app_global_env.js"></script>
    <script src="../config-scripts/dependencies.js?v=16"></script>
    <script src="../config-scripts/js_app_settings.js?v=16"></script>
    <style>
        body {
            background: radial-gradient(ellipse at top, #1a1508 0%, #000 55%);
        }
        /* تحسين اللمس الفوري في الآيفون */
        a, button, [role="button"], [onclick] {
            touch-action: manipulation !important;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }
        .gold-text { color: #d4af37; }
        .gold-border { border-color: rgba(212, 175, 55, 0.45); }
        .hero-glow {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
        }
        @keyframes star-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-star-pulse {
            animation: star-pulse 2s infinite ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.6s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #orderItemsList img { transition: opacity 0.3s ease; }
        #orderItemsList img[loading] { opacity: 0; }
    </style>
</head>
<body class="min-h-screen text-white p-4 pb-10 fade-in">
    <div class="max-w-md mx-auto">
        <header class="text-center pt-4 pb-2">
            <p id="brand-en" class="text-xs tracking-[0.35em] text-amber-600/80 uppercase">Cafe Al-Saada</p>
            <h1 id="brand-ar" class="text-3xl font-bold gold-text mt-1">مقهى السعادة</h1>
        </header>

        <div id="heroWrap" class="mt-4 rounded-2xl overflow-hidden gold-border border-2 hero-glow bg-black aspect-[4/3] relative hidden">
            <img id="heroImage" src="" alt="صورة الطلب" loading="lazy" class="w-full h-full object-cover opacity-90" />
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
            <div class="absolute bottom-0 right-0 left-0 p-4 text-center">
                <p id="heroCaption" class="gold-text font-bold text-lg drop-shadow-lg"></p>
            </div>
        </div>

        <div class="mt-5 text-center">
            <span id="statusBadge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold border gold-border bg-zinc-900 gold-text">
                جاري التحميل...
            </span>
        </div>

        <p id="orderMeta" class="text-center mt-3 text-amber-200/90 text-sm font-semibold"></p>

        <!-- قسم التقييم يظهر فقط عند اكتمال الطلب -->
        <div id="ratingSection" class="hidden mt-6 p-4 rounded-2xl bg-zinc-900 border gold-border text-center shadow-xl">
            <p class="gold-text font-bold mb-3">كيف كانت تجربتك معنا؟</p>
            <a id="googleMapsLink" href="#" target="_blank" class="block group no-underline">
                <div class="animate-star-pulse flex justify-center gap-1 mb-1 text-3xl transition-transform group-active:scale-95">
                    <span class="text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]">⭐</span>
                    <span class="text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]">⭐</span>
                    <span class="text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]">⭐</span>
                    <span class="text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]">⭐</span>
                    <span class="text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]">⭐</span>
                </div>
                <p class="text-zinc-300 font-bold group-hover:text-yellow-400 transition-colors">ننتظر تقييمك على جوجل</p>
            </a>
        </div>

        <div class="mt-6 rounded-2xl border gold-border bg-zinc-950/90 overflow-hidden">
            <div class="px-4 py-3 border-b gold-border bg-black/60">
                <h2 class="text-lg font-bold gold-text">تفاصيل الطلب</h2>
            </div>
            <ul id="orderItemsList" class="px-3 py-2 max-h-64 overflow-y-auto text-sm">
                <li class="py-6 text-zinc-500 text-center">جاري تحميل الطلب...</li>
            </ul>
            <div class="px-4 py-4 border-t gold-border flex justify-between items-center bg-black/50">
                <span class="text-zinc-400">المجموع الكلي</span>
                <span id="orderTotal" class="text-2xl font-bold gold-text">—</span>
            </div>
        </div>

        <p id="readyMessage" class="hidden mt-5 text-center text-emerald-400 font-bold text-lg animate-pulse">
            ✓ الطلب جاهز للاستلام
        </p>
    </div>

    <script>
        var query = new URLSearchParams(window.location.search);
        var orderId = query.get("orderId");
        var orderCode = query.get("code");
        var appSettings = mergeSettings(null);

        function applyOrderViewBranding() {
            var en = document.getElementById("brand-en");
            var ar = document.getElementById("brand-ar");
            if (en) en.textContent = phrase(appSettings, "order_view_brand_en");
            if (ar) ar.textContent = phrase(appSettings, "order_view_brand_ar");
        }

        function applyLayoutSettings() {
            var ui = (appSettings && appSettings.ui) || {};
            var goldColor = ui.gold_color || '#D4AF37';
            var goldElements = document.querySelectorAll('.gold-text');
            for(var i=0; i<goldElements.length; i++) goldElements[i].style.color = goldColor;
            
            if (ui.text_font_size) document.documentElement.style.setProperty('--app-font-size', ui.text_font_size + 'px');

            var heroWrap = document.getElementById('heroWrap');
            if (heroWrap) {
                if (ui.border_width !== undefined) heroWrap.style.borderWidth = ui.border_width + 'px';
                heroWrap.style.borderColor = goldColor;
            }

            var orderMeta = document.getElementById('orderMeta');
            if (orderMeta) orderMeta.style.display = ui.show_code_text === false ? 'none' : '';
        }

        function parseItems(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw;
            try {
                var p = JSON.parse(raw);
                return Array.isArray(p) ? p : [];
            } catch(e) { return []; }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function setStatusUi(status, isDelivery) {
            var badge = document.getElementById("statusBadge");
            var readyMsg = document.getElementById("readyMessage");
            var ratingSec = document.getElementById("ratingSection");
            
            if (status === "completed") {
                badge.textContent = isDelivery ? "تم التوصيل" : "تم الاستلام";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-500/60 bg-emerald-950 text-emerald-400";
                readyMsg.textContent = phrase(appSettings, "order_view_completed_msg");
                readyMsg.classList.remove("hidden");
                if (ratingSec) {
                    ratingSec.classList.remove("hidden");
                    var link = document.getElementById("googleMapsLink");
                    if (link) link.href = phrase(appSettings, "google_maps_review_url");
                }
            } else if (status === "ready") {
                badge.textContent = "جاهز للاستلام";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-500/60 bg-emerald-950 text-emerald-400";
                readyMsg.textContent = isDelivery ? "تم تجهيز طلبك وهو بانتظار استلام السائق" : phrase(appSettings, "order_view_ready_msg");
                readyMsg.classList.remove("hidden");
                if (ratingSec) ratingSec.classList.add("hidden");
            } else if (status === "preparing") {
                badge.textContent = "قيد التجهيز";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold border border-amber-500/60 bg-amber-950 gold-text";
                readyMsg.classList.add("hidden");
                if (ratingSec) ratingSec.classList.add("hidden");
            } else {
                badge.textContent = "بانتظار العامل";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold border gold-border bg-zinc-900 gold-text";
                readyMsg.classList.add("hidden");
                if (ratingSec) ratingSec.classList.add("hidden");
            }
        }

        function formatTableNoForUser(text) {
            var strText = String(text != null ? text : "—");
            if (!strText || strText === "—") return "—";
            var isDelivery = strText.indexOf("توصيل") !== -1;
            var parts = strText.split('|');
            for (var i = 0; i < parts.length; i++) parts[i] = parts[i].trim();
            
            var notesPart = "";
            for (var i = 0; i < parts.length; i++) {
                if (parts[i].indexOf("ملاحظات:") !== -1 || parts[i].indexOf("الملاحظات:") !== -1 || parts[i].indexOf("ملاحظة:") !== -1) {
                    notesPart = parts[i];
                    break;
                }
            }
            var notes = "";
            if (notesPart) {
                var colonIndex = notesPart.indexOf(":");
                notes = colonIndex !== -1 ? notesPart.substring(colonIndex + 1).trim() : notesPart.trim();
            }
            
            if (isDelivery) {
                var namePart = "";
                for (var i = 0; i < parts.length; i++) {
                    if (parts[i].indexOf("الاسم:") !== -1) { namePart = parts[i]; break; }
                }
                var name = namePart ? namePart.replace("الاسم:", "").trim() : "توصيل";
                return "توصيل باسم " + name + (notes ? " (" + notes + ")" : "");
            } else {
                var cleanTable = strText;
                if (cleanTable.indexOf("محلي:") === 0) cleanTable = cleanTable.replace("محلي:", "").trim();
                var firstPart = cleanTable.split('|')[0] ? cleanTable.split('|')[0].trim() : "—";
                return "طاولة " + firstPart + (notes ? " (" + notes + ")" : "");
            }
        }

        function renderOrder(order) {
            var items = parseItems(order.items);
            var list = document.getElementById("orderItemsList");
            var priceDisplay = parseFloat(order.total_price || 0).toFixed(2) + " ريال";
            var tableRaw = order.table_no != null ? order.table_no : "—";
            document.getElementById("orderMeta").textContent = formatTableNoForUser(tableRaw) + " · " + priceDisplay;

            if (items.length === 0) {
                list.innerHTML = '<li class="py-6 text-zinc-500 text-center">لا توجد أصناف</li>';
            } else {
                list.innerHTML = items.map(function(item) {
                    var qty = parseInt(item.quantity) || 1;
                    var price = parseFloat(item.price) || 0;
                    var img = window.getSafeImageUrl ? window.getSafeImageUrl(item.image_url) : (item.image_url || "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=200&h=200&fit=crop");
                    return '<li class="flex gap-3 items-center py-3 border-b border-zinc-800/80 last:border-0">' +
                           '<img src="' + escapeHtml(img) + '" alt="صنف" loading="lazy" class="w-14 h-14 rounded-xl object-cover border gold-border flex-shrink-0" />' +
                           '<div class="flex-1 min-w-0"><p class="font-bold gold-text truncate">' + escapeHtml(item.name || "صنف") + '</p>' +
                           '<p class="text-zinc-500 text-xs">' + price + ' ر.س × ' + qty + '</p></div>' +
                           '<span class="gold-text font-bold">' + (price * qty) + ' ر.س</span></li>';
                }).join("");
            }

            var total = order.total_price != null ? parseFloat(order.total_price) : items.reduce(function(s, i) { return s + (parseFloat(i.price) || 0) * (parseInt(i.quantity) || 1); }, 0);
            document.getElementById("orderTotal").textContent = total + " ر.س";
            var isDelivery = order.table_no && (order.table_no.indexOf("توصيل") !== -1);
            
            var heroWrap = document.getElementById("heroWrap");
            var heroImg = document.getElementById("heroImage");
            var heroCaption = document.getElementById("heroCaption");
            var firstWithImage = items.filter(function(i) { return i.image_url; })[0];
            
            if (firstWithImage) {
                heroImg.src = window.getSafeImageUrl ? window.getSafeImageUrl(firstWithImage.image_url) : firstWithImage.image_url;
                heroCaption.textContent = firstWithImage.name || "طلبك من مقهى السعادة";
                heroWrap.classList.remove("hidden");
            } else if (items.length > 0) {
                heroImg.src = "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&h=600&fit=crop";
                heroCaption.textContent = items[0].name || "طلبك";
                heroWrap.classList.remove("hidden");
            }
            setStatusUi(order.status, isDelivery);
        }


        async function loadOrder() {
            var client = window.getSupabaseClient ? window.getSupabaseClient() : null;
            if (!orderId && !orderCode) return;
            if (!client) return;
            var req = client.from("orders").select("id, status, order_code, table_no, items, total_price, created_at");
            var res = await (orderCode ? req.eq("order_code", orderCode) : req.eq("id", orderId)).single();
            if (res.error || !res.data) {
                document.getElementById("statusBadge").textContent = "الطلب غير موجود";
                document.getElementById("orderItemsList").innerHTML =
                    '<li class="py-6 text-red-400 text-center">تعذر تحميل الطلب.</li>';
                return;
            }

            var orderData = res.data;
            renderOrder(orderData);

            var resolvedId = orderData.id;
            client
                .channel('order_view_' + resolvedId)
                .on(
                    "postgres_changes",
                    {
                        event: "UPDATE",
                        schema: "public",
                        table: "orders",
                        filter: "id=eq." + resolvedId,
                    },
                    function(payload) {
                        if (payload.new) renderOrder(payload.new);
                    }
                )
                .subscribe();
        }

        var isOrderViewInit = false;
        async function init() {
            if (isOrderViewInit) return;
            var client = window.getSupabaseClient ? window.getSupabaseClient() : null;
            if (!client) return;
            isOrderViewInit = true;

            appSettings = await loadAppSettings();
            applyOrderViewBranding();
            applyLayoutSettings();
            loadOrder();
        }
        window.addEventListener("supabaseReady", init);
        if (document.readyState !== "loading") init();
        else document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
