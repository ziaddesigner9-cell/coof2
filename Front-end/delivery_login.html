<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول عامل التوصيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-zinc-900 p-8 rounded-3xl border border-amber-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-5xl">🚗</span>
            <h1 class="text-2xl font-bold mt-4 text-amber-500">دخول عمال التوصيل</h1>
            <p class="text-zinc-500 text-sm mt-2">يرجى إدخال الرقم السري للمتابعة</p>
        </div>
        
        <div class="space-y-4">
            <input type="password" id="deliveryPass" placeholder="•••••" 
                   class="w-full p-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-center text-2xl tracking-widest focus:border-amber-500 outline-none">
            
            <button onclick="checkDeliveryAuth()" 
                    class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-4 rounded-2xl transition shadow-lg">
                دخول النظام
            </button>
            
            <a href="kitchen.html" class="block text-center text-zinc-500 text-sm hover:text-white transition">العودة للمطبخ</a>
        </div>
    </div>

    <script>
        function checkDeliveryAuth() {
            const pass = document.getElementById('deliveryPass').value;
            if (pass === '55555') {
                sessionStorage.setItem('delivery_auth', 'true');
                window.location.href = 'delivery_dashboard.html';
            } else {
                alert('الرقم السري غير صحيح!');
            }
        }
        // الدخول عبر زر Enter
        document.getElementById('deliveryPass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkDeliveryAuth();
        });
    </script>
</body>
</html>
