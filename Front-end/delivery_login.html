<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="delivery_login_title">دخول عامل التوصيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
    <script src="../config-scripts/language.js"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen p-6 relative">
    
    <div id="lang-picker-container" class="absolute top-4 right-4 z-50"></div>

    <div class="w-full max-w-md bg-zinc-900 p-8 rounded-3xl border border-amber-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-5xl">🚗</span>
            <h1 class="text-2xl font-bold mt-4 text-amber-500" data-key="delivery_login_header">دخول عمال التوصيل</h1>
            <p class="text-zinc-500 text-sm mt-2" data-key="delivery_login_desc">يرجى إدخال الرقم السري للمتابعة</p>
        </div>
        
        <div class="space-y-4">
            <input type="password" id="deliveryPass" placeholder="•••••" 
                   class="w-full p-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-center text-2xl tracking-widest focus:border-amber-500 outline-none">
            
            <button onclick="checkDeliveryAuth()" data-key="login_btn"
                    class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-4 rounded-2xl transition shadow-lg">
                دخول النظام
            </button>
            
            <a href="kitchen.html" class="block text-center text-zinc-500 text-sm hover:text-white transition" data-key="delivery_back_kitchen">العودة للمطبخ</a>
        </div>
    </div>

    <script>
        const LOCAL_TRANSLATIONS = {
            ar: {
                delivery_login_title: 'دخول عامل التوصيل',
                delivery_login_header: 'دخول عمال التوصيل',
                delivery_login_desc: 'يرجى إدخال الرقم السري للمتابعة',
                delivery_back_kitchen: 'العودة للمطبخ',
                login_btn: 'دخول النظام',
                login_failed: 'الرقم السري غير صحيح!'
            },
            en: {
                delivery_login_title: 'Driver Login',
                delivery_login_header: 'Delivery Driver Login',
                delivery_login_desc: 'Please enter PIN code to continue',
                delivery_back_kitchen: 'Back to Kitchen',
                login_btn: 'Enter System',
                login_failed: 'Incorrect PIN code!'
            },
            'en-AU': {
                delivery_login_title: 'Driver Login',
                delivery_login_header: 'Delivery Driver Login',
                delivery_login_desc: 'Please enter PIN code to continue',
                delivery_back_kitchen: 'Back to Kitchen',
                login_btn: 'Enter System',
                login_failed: 'Incorrect PIN code!'
            },
            de: {
                delivery_login_title: 'Fahrer-Login',
                delivery_login_header: 'Lieferfahrer-Anmeldung',
                delivery_login_desc: 'Bitte PIN-Code eingeben, um fortzufahren',
                delivery_back_kitchen: 'Zurück zur Küche',
                login_btn: 'System betreten',
                login_failed: 'Falscher PIN-Code!'
            },
            fr: {
                delivery_login_title: 'Connexion Livreur',
                delivery_login_header: 'Connexion des Livreurs',
                delivery_login_desc: 'Veuillez saisir le code PIN pour continuer',
                delivery_back_kitchen: 'Retour à la cuisine',
                login_btn: 'Entrer dans le système',
                login_failed: 'Code PIN incorrect !'
            }
        };

        function applyLocalTranslations(lang) {
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (LOCAL_TRANSLATIONS[lang] && LOCAL_TRANSLATIONS[lang][key]) {
                    el.innerText = LOCAL_TRANSLATIONS[lang][key];
                } else if (window.translations && window.translations[lang] && window.translations[lang][key]) {
                    el.innerText = window.translations[lang][key];
                }
            });
        }

        window.addEventListener('languageChanged', (e) => {
            applyLocalTranslations(e.detail.lang);
        });

        window.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("coof2_userLang") || "ar";
            applyLocalTranslations(savedLang);
            if (typeof renderLanguageDropdown === "function") {
                renderLanguageDropdown('lang-picker-container');
            }
        });

        function checkDeliveryAuth() {
            const pass = document.getElementById('deliveryPass').value;
            const lang = localStorage.getItem("coof2_userLang") || "ar";
            if (pass === '55555') {
                sessionStorage.setItem('delivery_auth', 'true');
                window.location.href = 'delivery_dashboard.html';
            } else {
                alert(LOCAL_TRANSLATIONS[lang] ? LOCAL_TRANSLATIONS[lang].login_failed : 'الرقم السري غير صحيح!');
            }
        }

        document.getElementById('deliveryPass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkDeliveryAuth();
        });
    </script>
</body>
</html>
