<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المشروبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
    <script src="../config-scripts/language.js"></script>
    <link rel="stylesheet" href="../config-scripts/theme.css" />
    <style>body.has-bottom-nav { padding-bottom: 5.5rem; }</style>
</head>
<body class="app-theme min-h-screen">
    <div class="app-vignette fixed inset-0 pointer-events-none z-0"></div>
    <div id="lang-picker-container" class="absolute top-4 right-4 z-50"></div>

    <header class="relative z-10 p-6 pt-8 text-center">
        <p class="gold-text-soft text-xs tracking-widest">CAFE AL-SAADA</p>
        <h1 id="page-title" class="text-2xl gold-title mt-1">قائمة المشروبات</h1>
    </header>

    <main id="menu-items" class="relative z-10 max-w-xl mx-auto grid grid-cols-1 gap-4 px-4">
        <p data-key="loading" class="gold-text-soft text-center py-8">جاري التحميل...</p>
    </main>

    <div class="fixed bottom-[5.25rem] left-1/2 -translate-x-1/2 w-full max-w-xl px-4 flex justify-center items-center z-40 pointer-events-none">
        <div class="pointer-events-auto text-center w-auto mx-auto flex justify-center items-center">
            <a href="../admin-panel/admin-login.html" data-key="worker_btn"
                class="text-[10px] text-zinc-600 hover:text-amber-500 transition-colors duration-200 block text-center font-medium"
                style="text-align: center !important; display: block !important;">
                عامل
            </a>
        </div>
    </div>

    <script src="../config-scripts/js_categories.js"></script>
    <script>
        const cat = new URLSearchParams(window.location.search).get("cat");
        if (!cat || !window.MENU_CATEGORY_KEYS || !window.MENU_CATEGORY_KEYS.includes(cat)) {
            window.location.replace("../index.html");
        } else {
            function updateMenuTitle() {
                const label = phrase(null, "category_" + cat + "_label") || window.MENU_CATEGORY_LABELS[cat] || "القائمة";
                document.getElementById("page-title").textContent = label;
                document.title = label;
            }
            updateMenuTitle();
            window.addEventListener('languageChanged', updateMenuTitle);
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderLanguageDropdown === 'function') {
                renderLanguageDropdown('lang-picker-container');
            }
        });
    </script>
    <script src="../config-scripts/js_menu.js"></script>
    <script src="../config-scripts/bottom-nav.js"></script>
    <!-- Vercel Analytics & Speed Insights -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
