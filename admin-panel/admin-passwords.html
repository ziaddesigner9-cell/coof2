<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="admin_passwords_title">إدارة الرموز السرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
    <script src="../config-scripts/language.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem("coof2_role") !== "admin") {
            window.location.href = "admin-login.html";
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen p-6 md:p-10 select-none relative">
    <div id="lang-picker-container" class="absolute top-4 right-4 z-50"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-amber-800/30 pb-4">
            <div>
                <p data-key="security_settings_label" class="text-amber-600/70 text-xs tracking-widest">⚙️ SECURITY Settings</p>
                <h1 data-key="admin_passwords_header" class="text-2xl font-bold text-amber-400">إدارة الرموز السرية للموظفين</h1>
            </div>
            <a href="admin-dashboard.html" data-key="back_to_dashboard" class="text-sm text-zinc-500 hover:text-amber-400">العودة للوحة التحكم</a>
        </header>

        <main class="bg-zinc-900/50 border border-zinc-800/80 rounded-3xl p-6 md:p-8 backdrop-blur-sm space-y-6">
            <div>
                <label data-key="select_department_label" class="block text-sm text-zinc-400 mb-2">1. حدد قسم الموظف:</label>
                <select id="roleSelect" class="w-full bg-black border border-zinc-700 rounded-xl p-4 text-white outline-none focus:border-amber-500 transition-colors text-md">
                    <option value="worker" data-key="worker_department_option">👨‍🍳 قسم المطبخ (Worker)</option>
                    <option value="delivery" data-key="delivery_department_option">🚚 قسم التوصيل (Driver)</option>
                    <option value="admin" data-key="admin_department_option">⚙️ المدير العام (Admin)</option>
                </select>
            </div>

            <div>
                <label data-key="new_pin_label" class="block text-sm text-zinc-400 mb-2">2. الرمز السري الجديد (PIN):</label>
                <input type="password" id="newPinInput" data-key="new_pin_placeholder" placeholder="أدخل رقم سري جديد (مثال: 54321)" 
                       class="w-full text-center bg-black border border-zinc-700 rounded-xl p-4 text-white outline-none focus:border-amber-500 transition-colors text-xl font-bold tracking-widest"
                       maxlength="15" />
                <p data-key="new_pin_note" class="text-zinc-500 text-xs mt-2 text-right">⚠️ يرجى التأكد من إعطاء الرمز السري الجديد للعامل فوراً بعد التحديث ليتمكن من الدخول.</p>
            </div>

            <button id="saveBtn" onclick="updatePassword()" data-key="save_pin_button"
                    class="w-full py-4 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black font-black rounded-xl transition active:scale-[0.98] text-center shadow-lg shadow-amber-950/20 text-md flex items-center justify-center gap-2">
                💾 حفظ وتحديث الرمز السري
            </button>

            <div id="statusMessage" class="hidden text-center text-sm p-3 rounded-xl"></div>
        </main>
    </div>

    <script>
        async function updatePassword() {
            const roleSelect = document.getElementById("roleSelect");
            const newPinInput = document.getElementById("newPinInput");
            const saveBtn = document.getElementById("saveBtn");
            const statusMessage = document.getElementById("statusMessage");

            const selectedRole = roleSelect.value;
            const newPin = newPinInput.value.trim();

            if (!newPin) {
                alert(phrase(null, "validate_enter_new_pin"));
                return;
            }

            if (newPin.length < 4) {
                alert(phrase(null, "validate_pin_length"));
                return;
            }

            const client = typeof window.getSupabaseClient === "function" ? window.getSupabaseClient() : null;
            if (!client) {
                alert(phrase(null, "db_connection_error"));
                return;
            }

            saveBtn.disabled = true;
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = phrase(null, "saving_and_encrypting");
            statusMessage.classList.add("hidden");

            try {
                const { data, error } = await client.rpc('update_staff_password', {
                    role_type: selectedRole,
                    new_password: newPin
                });

                if (error) {
                    console.error("فشل التحديث:", error);
                    statusMessage.className = "text-red-400 bg-red-950/30 border border-red-800/40 text-center text-sm p-3 rounded-xl";
                    statusMessage.innerText = phrase(null, "update_pin_failed") + error.message;
                    statusMessage.classList.remove("hidden");
                } else {
                    statusMessage.className = "text-emerald-400 bg-emerald-950/30 border border-emerald-800/40 text-center text-sm p-3 rounded-xl";
                    statusMessage.innerText = phrase(null, "update_pin_success");
                    statusMessage.classList.remove("hidden");
                    newPinInput.value = "";
                }
            } catch (err) {
                console.error("خطأ:", err);
                statusMessage.className = "text-red-400 bg-red-950/30 border border-red-800/40 text-center text-sm p-3 rounded-xl";
                statusMessage.innerText = phrase(null, "unexpected_error");
                statusMessage.classList.remove("hidden");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof renderLanguageDropdown === 'function') {
                renderLanguageDropdown('lang-picker-container');
            }
        });
    </script>
</body>
</html>
