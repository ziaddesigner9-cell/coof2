<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرموز السرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        // حماية الصفحة من الوصول غير المصرح به
        if (localStorage.getItem("coof2_role") !== "admin") {
            window.location.href = "admin-login.html";
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen p-6 md:p-10 select-none">
    
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-amber-800/30 pb-4">
            <div>
                <p class="text-amber-600/70 text-xs tracking-widest">⚙️ SECURITY Settings</p>
                <h1 class="text-2xl font-bold text-amber-400">إدارة الرموز السرية للموظفين</h1>
            </div>
            <a href="admin-dashboard.html" class="text-sm text-zinc-500 hover:text-amber-400">العودة للوحة التحكم</a>
        </header>

        <main class="bg-zinc-900/50 border border-zinc-800/80 rounded-3xl p-6 md:p-8 backdrop-blur-sm space-y-6">
            
            <div>
                <label class="block text-sm text-zinc-400 mb-2">1. حدد قسم الموظف:</label>
                <select id="roleSelect" class="w-full bg-black border border-zinc-700 rounded-xl p-4 text-white outline-none focus:border-amber-500 transition-colors text-md">
                    <option value="worker">👨‍🍳 قسم المطبخ (Worker)</option>
                    <option value="delivery">🚚 قسم التوصيل (Driver)</option>
                    <option value="admin">⚙️ المدير العام (Admin)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-2">2. الرمز السري الجديد (PIN):</label>
                <input type="password" id="newPinInput" placeholder="أدخل رقم سري جديد (مثال: 54321)" 
                       class="w-full text-center bg-black border border-zinc-700 rounded-xl p-4 text-white outline-none focus:border-amber-500 transition-colors text-xl font-bold tracking-widest"
                       maxlength="15" />
                <p class="text-zinc-500 text-xs mt-2 text-right">⚠️ يرجى التأكد من إعطاء الرمز السري الجديد للعامل فوراً بعد التحديث ليتمكن من الدخول.</p>
            </div>

            <button id="saveBtn" onclick="updatePassword()" 
                    class="w-full py-4 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black font-black rounded-xl transition active:scale-[0.98] text-center shadow-lg shadow-amber-950/20 text-md flex items-center justify-center gap-2">
                💾 حفظ وتحديث الرمز السري
            </button>

            <div id="statusMessage" class="hidden text-center text-sm p-3 rounded-xl"></div>
        </main>
    </div>

    <script>
        async function updatePassword() {
            const roleSelect = document.getElementById("roleSelect");
            const newPinInput = document.getElementById("newPinInput");
            const saveBtn = document.getElementById("saveBtn");
            const statusMessage = document.getElementById("statusMessage");

            const selectedRole = roleSelect.value;
            const newPin = newPinInput.value.trim();

            if (!newPin) {
                alert("يرجى إدخال الرمز السري الجديد أولاً.");
                return;
            }

            if (newPin.length < 4) {
                alert("يجب أن لا يقل الرمز السري عن 4 أرقام أو حروف.");
                return;
            }

            const client = typeof window.getSupabaseClient === "function" ? window.getSupabaseClient() : null;
            if (!client) {
                alert("⚠️ خطأ: فشل الاتصال بقاعدة البيانات.");
                return;
            }

            // تفعيل حالة التحميل
            saveBtn.disabled = true;
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = "جاري الحفظ والتشفيير... ⏳";
            statusMessage.classList.add("hidden");

            try {
                // استدعاء دالة الخادم الآمنة (RPC)
                const { data, error } = await client.rpc('update_staff_password', {
                    role_type: selectedRole,
                    new_password: newPin
                });

                if (error) {
                    console.error("فشل التحديث:", error);
                    statusMessage.className = "text-red-400 bg-red-950/30 border border-red-800/40 text-center text-sm p-3 rounded-xl";
                    statusMessage.innerText = "❌ فشل تحديث الرمز السري: " + error.message;
                    statusMessage.classList.remove("hidden");
                } else {
                    statusMessage.className = "text-emerald-400 bg-emerald-950/30 border border-emerald-800/40 text-center text-sm p-3 rounded-xl";
                    statusMessage.innerText = "✅ تم تحديث الرمز السري وتشفيره بنجاح في قاعدة البيانات!";
                    statusMessage.classList.remove("hidden");
                    newPinInput.value = ""; // تفريغ الحقل
                }
            } catch (err) {
                console.error("خطأ:", err);
                statusMessage.className = "text-red-400 bg-red-950/30 border border-red-800/40 text-center text-sm p-3 rounded-xl";
                statusMessage.innerText = "❌ حدث خطأ غير متوقع.";
                statusMessage.classList.remove("hidden");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
