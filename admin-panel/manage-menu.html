<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة صنف جديد | لوحة المدير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/dependencies.js?v=6"></script>
    <script src="../config-scripts/js_categories.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>
    <script src="../config-scripts/js_admin.js"></script>
    <script>if (localStorage.getItem("coof2_role") !== "admin") location.href = "admin-login.html";</script>
    <link rel="stylesheet" href="../config-scripts/theme.css" />
</head>
<body class="bg-black text-white min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- واجهة التحميل المركزية -->
    <div id="admin-loader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center hidden">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mx-auto"></div>
            <p class="mt-4 text-amber-500 font-bold tracking-widest">جاري الحفظ...</p>
        </div>
    </div>

    <div class="w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <a href="admin-dashboard.html" class="text-amber-500 text-sm hover:text-amber-300 transition">← لوحة المدير</a>
            <a href="edit-items.html" class="text-zinc-400 text-sm hover:text-amber-400 transition">✏️ تعديل الأصناف</a>
        </div>

        <h1 class="text-3xl font-bold text-amber-400 mb-8">➕ إضافة صنف جديد</h1>
        
        <div class="bg-zinc-900 p-6 md:p-8 rounded-[2rem] border border-amber-800/30 shadow-2xl space-y-6">
            <div>
                <label class="block text-amber-300 text-sm font-bold mb-2">اسم الصنف</label>
                <input type="text" id="name" placeholder="مثال: كابتشينو" class="w-full p-4 rounded-2xl bg-black border border-amber-800/40 text-white outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-amber-300 text-sm font-bold mb-2">السعر (ريال)</label>
                <input type="number" id="price" placeholder="0.00" class="w-full p-4 rounded-2xl bg-black border border-amber-800/40 text-white outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-amber-300 text-sm font-bold mb-2">التصنيف</label>
                <select id="category" class="w-full p-4 rounded-2xl bg-black border border-amber-800/40 text-white outline-none focus:border-amber-500 transition cursor-pointer">
                    <option value="hot">مشروبات ساخنة</option>
                    <option value="cold">مشروبات باردة</option>
                    <option value="dessert">الحلى</option>
                    <option value="shisha">شيشة</option>
                </select>
            </div>
            
            <div>
                <label class="block text-amber-300 text-sm font-bold mb-3">اختر صورة من المكتبة</label>
                <div id="galleryGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 border border-amber-800/20 p-4 rounded-2xl h-64 overflow-y-auto bg-black/50">
                    <p class="col-span-full text-zinc-600 text-center py-10">جاري تحميل الصور...</p>
                </div>
            </div>
            
            <button onclick="handleSave()" id="saveBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-black p-4 rounded-2xl font-extrabold text-lg transition shadow-xl shadow-amber-900/20 active:scale-95">
                حفظ الصنف في القائمة ✓
            </button>
        </div>
    </div>

    <script>
        let selectedImageUrl = "";

        async function loadGalleryForMenu() {
            const client = window.getSupabaseClient?.();
            if (!client) return;
            
            const grid = document.getElementById("galleryGrid");
            try {
                const { data, error } = await client.from("gallery").select("*").order('created_at', { ascending: false });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    if (grid) grid.innerHTML = `<p class="col-span-full text-zinc-600 text-center py-10">لا توجد صور. ارفع صوراً أولاً.</p>`;
                    return;
                }

                if (grid) {
                    grid.innerHTML = data.map(img => `
                        <div class="relative aspect-square">
                            <img src="${img.image_url}" onclick="selectImage('${img.image_url}', this)" 
                                 class="gallery-img cursor-pointer rounded-xl border-4 border-transparent hover:border-amber-500/50 w-full h-full object-cover transition-all shadow-md">
                        </div>
                    `).join('');
                }
            } catch (err) {
                if (grid) grid.innerHTML = `<p class="col-span-full text-red-400 text-center py-10">${err.message}</p>`;
            }
        }

        function selectImage(url, element) {
            selectedImageUrl = url;
            document.querySelectorAll('.gallery-img').forEach(img => {
                img.classList.remove('border-amber-500');
                img.classList.add('border-transparent');
            });
            element.classList.remove('border-transparent');
            element.classList.add('border-amber-500');
        }

        async function handleSave() {
            const nameEl = document.getElementById('name');
            const priceEl = document.getElementById('price');
            const catEl = document.getElementById('category');

            if (!nameEl?.value.trim()) return alert("يرجى إدخال اسم الصنف");
            if (!priceEl?.value || parseFloat(priceEl.value) < 0) return alert("يرجى إدخال سعر صحيح");
            if (!selectedImageUrl) return alert("يرجى اختيار صورة من المكتبة أولاً");

            const btn = document.getElementById('saveBtn');
            if (typeof window.showAdminLoader === "function") window.showAdminLoader();

            try {
                const client = window.getSupabaseClient?.();
                if (!client) throw new Error("قاعدة البيانات غير متصلة");
                
                const { data, error } = await client.from("items").insert([{
                    name: nameEl.value.trim(),
                    price: parseFloat(priceEl.value),
                    category: catEl.value,
                    image_url: selectedImageUrl,
                    is_available: true
                }]).select();

                if (error) throw error;
                if (!data || data.length === 0) throw new Error("فشل الحفظ في قاعدة البيانات. تحقق من سياسات RLS.");

                alert("تمت إضافة «" + nameEl.value + "» بنجاح! ✓");

                // تفريغ الحقول للصنف التالي
                nameEl.value = "";
                priceEl.value = "";
                selectedImageUrl = "";
                document.querySelectorAll('.gallery-img').forEach(img => {
                    img.classList.remove('border-amber-500');
                    img.classList.add('border-transparent');
                });

            } catch (error) {
                console.error("Save Error:", error);
                alert("فشل الحفظ: " + error.message);
            } finally {
                if (typeof window.hideAdminLoader === "function") window.hideAdminLoader();
            }
        }

        window.addEventListener("supabaseReady", loadGalleryForMenu);
        if (window.getSupabaseClient?.()) loadGalleryForMenu();
    </script>
