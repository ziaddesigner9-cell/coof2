<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دخول المدير</title>

    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen w-full p-0 m-0 overflow-hidden select-none">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div class="fixed inset-0 w-full h-full flex flex-col justify-center items-center text-center px-4 z-10 overflow-y-auto" 
         style="direction: rtl !important; box-sizing: border-box !important;">
        
        <div class="w-full max-w-sm flex flex-col items-center justify-center mx-auto space-y-6">
            
            <div class="w-full flex flex-col items-center justify-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl mb-4 text-3xl select-none">
                    ⚙️
                </div>
                <h1 class="text-2xl font-black text-white text-center w-full block tracking-tight">
                    لوحة التحكم الإدارية
                </h1>
                <p class="text-zinc-400 text-xs text-center w-full block mt-2">يرجى إدخال كلمة مرور المدير للمتابعة</p>
            </div>

            <div class="w-full bg-zinc-900/50 border border-zinc-800/80 rounded-3xl p-6 flex flex-col items-center justify-center backdrop-blur-sm">
                 <label class="block text-xs text-zinc-500 mb-2 w-full text-center">كلمة المرور</label>
                 
                 <input type="password" id="adminPassInput" placeholder="••••••••" 
                        class="w-full text-center bg-black border border-zinc-700 rounded-xl p-3 text-white mb-4 outline-none focus:border-blue-500 transition-colors text-lg" 
                        onkeyup="if(event.key==='Enter') handleAuth()"
                        style="text-align: center !important;" />
                        
                 <button onclick="handleAuth()" 
                         class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl transition active:scale-[0.98] text-center shadow-lg shadow-blue-900/20 text-sm">
                      تسجيل الدخول للمدير
                 </button>
            </div>

            <div class="w-full text-center pt-2">
                <a href="../index.html" class="text-zinc-500 hover:text-zinc-300 text-xs transition inline-block py-2">العودة للرئيسية</a>
            </div>

        </div>
    </div>

    <script>
    function handleAuth() {
        const password = document.getElementById('adminPassInput').value;
        
        console.log("محاولة تسجيل دخول للمدير...");

        if (typeof verifyLogin === "function") {
            if (verifyLogin(password, 'admin')) {
                console.log("تم التحقق بنجاح! جاري التوجيه...");
                window.location.href = 'admin-dashboard.html';
            } else {
                alert("⚠️ كلمة المرور غير صحيحة.");
            }
        } else {
            alert("⚠️ خطأ في تحميل ملفات الحماية.");
        }
    }
    </script>
</body>
</html>
