<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المدير</title>

    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 p-4 relative overflow-x-hidden portal-screen-center">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md mx-auto z-10 space-y-8">
        
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl mb-2 text-3xl">
                ⚙️
            </div>
            <h1 class="text-3xl font-black tracking-tight text-white bg-gradient-to-r from-blue-100 to-blue-400 bg-clip-text text-transparent">
                لوحة التحكم الإدارية
            </h1>
            <p class="text-sm text-zinc-400">يرجى إدخال كلمة مرور المدير للمتابعة</p>
        </div>

        <div class="space-y-6">
            <div class="group bg-zinc-900/40 backdrop-blur-md p-8 rounded-3xl border border-zinc-800/80 hover:border-blue-500/40 shadow-2xl transition-all duration-300">
                <div class="space-y-4 text-center">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-2">كلمة المرور</label>
                        <input type="password" id="adminPassInput" 
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white text-center text-xl tracking-widest placeholder:tracking-normal focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/30 outline-none transition" 
                               onkeyup="if(event.key==='Enter') handleAuth()"
                               placeholder="••••••••">
                    </div>
                    <button onclick="handleAuth()" 
                            class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-black py-4 rounded-xl transition-all duration-300 shadow-lg shadow-blue-950/20 active:scale-[0.98]">
                        تسجيل الدخول للمدير
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="../index.html" class="text-zinc-500 hover:text-zinc-300 text-xs transition">العودة للرئيسية</a>
        </div>
    </div>

    <script>
    function handleAuth() {
        const password = document.getElementById('adminPassInput').value;
        
        console.log("محاولة تسجيل دخول للمدير...");

        if (typeof verifyLogin === "function") {
            if (verifyLogin(password, 'admin')) {
                console.log("تم التحقق بنجاح! جاري التوجيه...");
                window.location.href = 'admin-dashboard.html';
            } else {
                alert("⚠️ كلمة المرور غير صحيحة.");
            }
        } else {
            alert("⚠️ خطأ في تحميل ملفات الحماية.");
        }
    }
    </script>
</body>
</html>
