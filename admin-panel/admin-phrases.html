        <h1 class="text-2xl font-bold text-amber-400 mt-4 mb-2" data-key="phrases_title">تعديل العبارات</h1>
        <p class="text-zinc-500 text-sm mb-6" data-key="phrases_desc">كل حقل يوضح أين تظهر العبارة في التطبيق.</p>

        <div id="phrases-form" class="space-y-4"></div>

        <div class="mt-10 pt-8 border-t border-zinc-800/80">
            <h3 class="text-amber-500 font-black text-base flex items-center gap-2 mb-2">
                <span>🛒</span> <span data-key="motivational_phrases_title">عبارات تشجيعية عند الإضافة للسلة</span>
            </h3>
            <p class="text-zinc-500 text-xs mb-4" data-key="motivational_phrases_desc">تظهر هذه العبارات بالتوالي وبشكل عشوائي متتابع للزبون فور الضغط على إضافة صنف لزيادة تفاعله مع التطبيق.</p>
            
            <div id="cart-phrases-form" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-zinc-950 p-5 rounded-2xl border border-amber-800/20">
            </div>
        </div>

            حفظ جميع العبارات والإعدادات
        </button>
    </div>

    <div id="style-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
        <div class="w-full max-w-md bg-zinc-950 border border-amber-800/40 rounded-3xl p-6 shadow-2xl">

                <button type="button" onclick="closeStyleModal()" class="text-zinc-500 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="text-xs text-zinc-500 block mb-1" data-key="font_size_label">حجم الخط (تكبير/تصغير)</label>
                    <input id="ui_font_size" type="range" min="12" max="48" class="w-full accent-amber-500 h-2 bg-zinc-900 rounded-lg appearance-none cursor-pointer" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-zinc-500 block mb-1" data-key="box_width_label">عرض الإطار (Scaling)</label>

                    </div>
                    <div>
                        <label class="text-xs text-zinc-500 block mb-1" data-key="box_height_label">طول الإطار (Scaling)</label>

                    </div>
                </div>
                <div>
                    <label class="text-xs text-zinc-500 block mb-1" data-key="border_width_label">سمك إطار الصندوق</label>
                    <input id="ui_border_width" type="number" min="0" max="15" class="w-full p-3 rounded-xl bg-black border border-zinc-800 text-amber-100 outline-none focus:border-amber-500" />
                </div>
                <div>

                    <input id="ui_gold_color" type="color" class="w-full h-12 rounded-xl border-2 border-zinc-800 bg-transparent cursor-pointer p-1" />
                </div>
                
                <button type="button" id="modalSaveBtn" class="w-full py-4 rounded-2xl bg-amber-600 hover:bg-amber-500 text-black font-bold text-lg mt-2 transition shadow-lg shadow-amber-900/20" data-key="apply_style_btn">
                    تطبيق وحفظ المظهر
                </button>
            </div>
        </div>
    </div>

                en: { label: "Sixth Phrase (6)", placeholder: "e.g. Superb choice! 🌟" },
                "en-AU": { label: "Sixth Phrase (6)", placeholder: "e.g. Superb choice! 🌟" },
                de: { label: "Sechste Phrase (6)", placeholder: "z.B. Hervorragende Wahl! 🌟" },
                fr: { label: "Sixième phrase (6)", placeholder: "ex: Superbe ajout ! 🌟" }
            }
        };

        let settings = mergeSettings(null);

        function getFieldInfo(fieldKey) {
            let lang = localStorage.getItem("coof2_userLang") || "ar";
            if (!FIELD_TRANSLATIONS[fieldKey]) {
                return { label: fieldKey, location: "", placeholder: "" };
            }
            const item = FIELD_TRANSLATIONS[fieldKey];
            return item[lang] || item["ar"] || { label: fieldKey, location: "", placeholder: "" };
        }

        function renderForm() {
            // أولاً: بناء عبارات النظام العادية
            const form = document.getElementById("phrases-form");
            form.innerHTML = PHRASE_FIELDS.map(
                (f) => {
                    const info = getFieldInfo(f.key);
                    return `
                    <div class="p-4 rounded-xl border border-amber-800/30 bg-zinc-950 hover:border-amber-600/50 transition cursor-pointer group" onclick="openStyleModal()">
                        <div class="flex flex-wrap justify-between gap-2 mb-2">
                            <span class="font-bold text-amber-300 text-sm">${info.label}</span>
                            <span class="text-[11px] text-zinc-500 bg-zinc-900 px-2 py-1 rounded">${info.location}</span>
                        </div>
                        <div class="flex gap-2" onclick="event.stopPropagation()">
                            <input type="text" data-phrase-key="${f.key}" value="${(settings.phrases[f.key] || "").replace(/"/g, "&quot;")}"
                                class="flex-1 p-3 rounded-lg bg-black border border-amber-800/40 text-white text-sm focus:border-amber-500 outline-none" />
                            <button type="button" onclick="openStyleModal()" class="shrink-0 w-11 h-11 flex items-center justify-center rounded-lg bg-zinc-900 border border-amber-700/30 text-amber-400 hover:bg-amber-500 hover:text-black transition" title="${phrase(null, 'edit_btn_text', 'تعديل')}">
                                🎨
                            </button>
                        </div>
                    </div>`;
                }
            ).join("");

            // ثانياً: بناء حقول عبارات السلة الستة الجديدة داخل قسمها المخصص
            const cartForm = document.getElementById("cart-phrases-form");
            if (cartForm) {
                cartForm.innerHTML = CART_PHRASE_FIELDS.map(
                    (cf) => {
                        const info = getFieldInfo(cf.key);
                        return `
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1 font-medium">${info.label}</label>
                            <input type="text" data-phrase-key="${cf.key}" placeholder="${info.placeholder}" 
                                value="${(settings.phrases[cf.key] || "").replace(/"/g, "&quot;")}"
                                class="w-full p-3 rounded-xl bg-black border border-zinc-800 text-amber-100 text-sm outline-none focus:border-amber-500 transition" />
                        </div>`;
                    }
                ).join("");
            }
        }

        async function init() {
            settings = await loadAppSettings(true);
            settings.ui = settings.ui || window.DEFAULT_APP_SETTINGS?.ui || {};
            settings.phrases = settings.phrases || {};
            renderForm();
            populateUiControls();
        }

        function openStyleModal() {
            document.getElementById('style-modal').classList.remove('hidden');
        }

        function closeStyleModal() {
            document.getElementById('style-modal').classList.add('hidden');
        }

        function showLoader() {
            document.getElementById('admin-loader')?.classList.remove('hidden');
        }

        function hideLoader() {
            document.getElementById('admin-loader')?.classList.add('hidden');
        }

        async function saveAll(source) {
            const isModal = source === 'modal';
            
            // مزامنة العبارات من كافة حقول الإدخال في الصفحة
            document.querySelectorAll("[data-phrase-key]").forEach((input) => {
                settings.phrases[input.dataset.phraseKey] = input.value;
            });

            // مزامنة إعدادات المظهر
            settings.ui = settings.ui || {}; 
            const fsEl = document.getElementById('ui_font_size'); 
            const bwEl = document.getElementById('ui_box_width'); 
            const bhEl = document.getElementById('ui_box_height'); 
            const brEl = document.getElementById('ui_border_width'); 
            const gcEl = document.getElementById('ui_gold_color'); 

            settings.ui.text_font_size = fsEl ? parseInt(fsEl.value, 10) : 16; 
            settings.ui.box_width = bwEl ? parseInt(bwEl.value, 10) : 220; 
            settings.ui.box_height = bhEl ? parseInt(bhEl.value, 10) : 220; 
            settings.ui.border_width = brEl ? parseInt(brEl.value, 10) : 1; 
            settings.ui.gold_color = gcEl ? gcEl.value : '#D4AF37'; 

            const btn = isModal ? document.getElementById("modalSaveBtn") : document.getElementById("saveBtn");
            const originalText = btn.textContent;
            
            if (btn) {
                btn.disabled = true;
                btn.textContent = phrase(null, 'saving_changes_loader', 'جاري حفظ التعديلات...');
            }
            showLoader();
            
            try {
                await saveAppSettings(settings);
                alert(phrase(null, 'save_success_toast', 'تم الحفظ وتحديث المظهر بنجاح! ✓'));
                if (isModal) closeStyleModal();
            } catch (e) {
                console.error("خطأ في الحفظ:", e);
                alert(phrase(null, 'save_failed_msg', 'فشل الحفظ: ') + e.message);
            } finally {
                hideLoader();
                btn.disabled = false;
                if (btn) btn.textContent = originalText;
            }
        }

        const saveBtn = document.getElementById("saveBtn");
        if (saveBtn) saveBtn.addEventListener("click", () => saveAll('main'));
        const modalSaveBtn = document.getElementById("modalSaveBtn");
        if (modalSaveBtn) modalSaveBtn.addEventListener("click", () => saveAll('modal'));
        
        // تعبئة عناصر المظهر
        function populateUiControls() {
            const ui = settings.ui || {};
            const fsEl = document.getElementById('ui_font_size');
            const bwEl = document.getElementById('ui_box_width');
            const bhEl = document.getElementById('ui_box_height');
            const brEl = document.getElementById('ui_border_width');
            const gcEl = document.getElementById('ui_gold_color');

            if (fsEl) fsEl.value = ui.text_font_size || 16;
            if (bwEl) bwEl.value = ui.box_width || 220;
            if (bhEl) bhEl.value = ui.box_height || 220;
            if (brEl) brEl.value = ui.border_width || 1;
            if (gcEl) gcEl.value = ui.gold_color || '#D4AF37';
        }

        // الاستماع لتغيير اللغة لإعادة بناء الحقول بلغتها المترجمة
        window.addEventListener('languageChanged', function() {
            renderForm();
        });

        window.addEventListener("DOMContentLoaded", () => {
            if (typeof renderLanguageDropdown === "function") {
                renderLanguageDropdown('lang-picker-container');
            }
        });

        window.addEventListener("supabaseReady", init);
        if (window.getSupabaseClient?.()) init();
    </script>
</body>
</html>
