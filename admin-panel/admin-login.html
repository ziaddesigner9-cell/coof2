<!DOCTYPE html>
<html lang="ar" dir="rtl" style="margin: 0 !important; padding: 0 !important; width: 100% !important; overflow-x: hidden !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الموظفين والإدارة</title>

    <script src="../app_global_env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/app_env.js"></script>
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
    <script src="../config-scripts/language.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box !important; }
        html, body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            background-color: #000000 !important;
        }
        .active-tab {
            background: linear-gradient(135deg, rgba(245, 215, 110, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-color: rgba(245, 215, 110, 0.5) !important;
            color: #f5d76e !important;
            box-shadow: 0 0 15px rgba(245, 215, 110, 0.1);
        }
    </style>
</head>
<body class="bg-black text-zinc-100 p-0 m-0 min-h-screen relative flex items-center justify-center">

    <!-- خلفية مضيئة فاخرة -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-yellow-500/5 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <!-- مغير اللغة في أعلى اليمين/اليسار تلقائياً حسب الاتجاه -->
    <div class="absolute top-4 right-4 z-50 pointer-events-auto" id="lang-picker-container"></div>

    <div class="w-full max-w-md mx-auto px-4 py-8 z-10 flex flex-col items-center justify-center min-h-screen">
        
        <div class="w-full space-y-6 flex flex-col justify-center items-center">
            
            <div class="text-center space-y-2 w-full flex flex-col items-center justify-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl mb-2 text-3xl select-none">
                    🔐
                </div>
                <h1 data-key="staff_portal_title" class="text-2xl font-black tracking-tight text-white block text-center w-full">
                    بوابة الموظفين والإدارة
                </h1>
                <p data-key="staff_portal_desc" class="text-xs text-zinc-400 block text-center w-full">مرحباً بك مجدداً، يرجى اختيار قسمك لتسجيل الدخول</p>
            </div>

            <!-- أزرار التبويبات الفاخرة -->
            <div class="grid grid-cols-3 gap-2 w-full bg-zinc-900/60 p-1.5 rounded-2xl border border-zinc-800/80">
                <button type="button" onclick="switchTab('admin')" id="tab-btn-admin" 
                        class="active-tab py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex flex-col items-center gap-1 border border-transparent text-zinc-400">
                    <span class="text-base">⚙️</span>
                    <span data-key="tab_admin">المدير</span>
                </button>
                <button type="button" onclick="switchTab('worker')" id="tab-btn-worker" 
                        class="py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex flex-col items-center gap-1 border border-transparent text-zinc-400">
                    <span class="text-base">👨‍🍳</span>
                    <span data-key="tab_kitchen">المطبخ</span>
                </button>
                <button type="button" onclick="switchTab('delivery')" id="tab-btn-delivery" 
                        class="py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex flex-col items-center gap-1 border border-transparent text-zinc-400">
                    <span class="text-base">🚚</span>
                    <span data-key="tab_delivery">التوصيل</span>
                </button>
            </div>

            <!-- بطاقة إدخال الرمز السري المشتركة -->
            <div class="w-full bg-zinc-900/40 backdrop-blur-md p-6 rounded-3xl border border-zinc-800/80 shadow-2xl flex flex-col items-center justify-center">
                <label data-key="password_label" class="block text-xs text-zinc-500 mb-3 w-full text-center">الرمز السري الخاص بالقسم</label>
                
                <input type="password" id="staffPassInput" 
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-white text-center text-xl tracking-widest placeholder:tracking-normal focus:border-amber-500/60 focus:ring-1 focus:ring-amber-500/30 outline-none transition" 
                       onkeyup="if(event.key==='Enter') triggerAuth()"
                       placeholder="••••••••" style="text-align: center !important;">
                       
                <button onclick="triggerAuth()" id="loginSubmitBtn"
                        class="w-full mt-4 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black font-black py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-amber-950/20 active:scale-[0.98] text-center flex items-center justify-center text-sm">
                    <span data-key="login_btn">تسجيل الدخول ←</span>
                </button>
            </div>

            <div class="w-full text-center space-y-3">
                <a href="../index.html" data-key="back_to_home" class="text-zinc-500 hover:text-amber-500 text-xs transition inline-block py-2">← العودة للرئيسية</a>
                <p data-key="all_rights_reserved" class="text-center text-[10px] text-zinc-700 tracking-wide w-full block">جميع الحقوق محفوظة © النظام الذكي لإدارة المطاعم</p>
            </div>
        </div>
    </div>

    <script>
    let activeRole = 'admin';

    function switchTab(role) {
        activeRole = role;
        
        // تحديث تنسيق أزرار التبويب
        document.querySelectorAll('[id^="tab-btn-"]').forEach(btn => {
            btn.classList.remove('active-tab');
        });
        
        const activeBtn = document.getElementById(`tab-btn-${role}`);
        if (activeBtn) activeBtn.classList.add('active-tab');
        
        // تفريغ الحقل والتركيز عليه
        const input = document.getElementById('staffPassInput');
        if (input) {
            input.value = '';
            input.focus();
        }
    }

    async function triggerAuth() {
        const passwordInput = document.getElementById('staffPassInput');
        const password = passwordInput.value;
        const btn = document.getElementById('loginSubmitBtn');
        
        let currentLang = 'ar';
        try {
            currentLang = localStorage.getItem('coof2_userLang') || 'ar';
        } catch (_) {}

        const msgChecking = (window.translations[currentLang] && window.translations[currentLang]['checking_status']) || "جاري التحقق... ⏳";
        const msgFailedAdmin = (window.translations[currentLang] && window.translations[currentLang]['login_failed_admin']) || "⚠️ الرمز السري للمدير غير صحيح.";
        const msgFailedStaff = (window.translations[currentLang] && window.translations[currentLang]['login_failed_staff']) || "⚠️ الرمز السري غير صحيح، يرجى المحاولة مرة أخرى.";

        if (typeof verifyLogin === "function") {
            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerText = msgChecking;

            const success = await verifyLogin(password, activeRole);

            if (success) {
                console.log(`تم التحقق بنجاح لدور ${activeRole}! جاري التوجيه...`);
                if (activeRole === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (activeRole === 'worker') {
                    window.location.href = '../Front-end/kitchen.html';
                } else if (activeRole === 'delivery') {
                    window.location.href = '../Front-end/delivery_dashboard.html';
                }
            } else {
                alert(activeRole === 'admin' ? msgFailedAdmin : msgFailedStaff);
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        } else {
            alert("⚠️ خطأ داخلي: لم يتم العثور على نظام الحماية.");
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        // تهيئة قائمة اختيار اللغة
        if (typeof renderLanguageDropdown === 'function') {
            renderLanguageDropdown('lang-picker-container');
        }
        
        // استماع لحدث تغيير اللغة لإعادة ترجمة الصفحة
        window.addEventListener('languageChanged', (e) => {
            const lang = e.detail.lang;
            // يمكن تعزيز الترجمة الإضافية إذا لزم الأمر
        });
    });
    </script>
</body>
</html>
