<!-- حاوية تسجيل الدخول الموحدة -->
<div class="max-w-md mx-auto p-6 space-y-8">
    
    <!-- قسم المطبخ (العامل) -->
    <div class="bg-zinc-900/80 p-6 rounded-3xl border border-amber-600/30 shadow-xl text-center">
        <div class="text-4xl mb-3">👨‍🍳</div>
        <h2 class="text-xl font-bold text-amber-500 mb-4">دخول طاقم المطبخ</h2>
        <input type="password" id="workerPass" 
               class="w-full bg-black border border-zinc-800 rounded-2xl p-4 text-white text-center text-xl mb-4 focus:border-amber-500 outline-none" 
               placeholder="كلمة مرور المطبخ">
        <button onclick="handleRoleLogin('worker')" 
                class="w-full bg-amber-600 hover:bg-amber-500 text-black font-black py-4 rounded-2xl transition active:scale-95">
            دخول المطبخ
        </button>
    </div>

    <!-- قسم سائق التوصيل -->
    <div class="bg-zinc-900/80 p-6 rounded-3xl border border-emerald-600/30 shadow-xl text-center">
        <div class="text-4xl mb-3">🚚</div>
        <h2 class="text-xl font-bold text-emerald-500 mb-4">دخول سائق التوصيل</h2>
        <input type="password" id="deliveryPass" 
               class="w-full bg-black border border-zinc-800 rounded-2xl p-4 text-white text-center text-xl mb-4 focus:border-emerald-500 outline-none" 
               placeholder="كلمة مرور التوصيل">
        <button onclick="handleRoleLogin('delivery')" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl transition active:scale-95">
            دخول نظام التوصيل
        </button>
    </div>

</div>

<script>
/** دالة معالجة الدخول بناءً على الدور المختيار */
function handleRoleLogin(role) {
    const inputId = role === 'worker' ? 'workerPass' : 'deliveryPass';
    const password = document.getElementById(inputId).value;
    
    // التحقق باستخدام ملف js_auth_config.js
    if (typeof verifyLogin === "function" && verifyLogin(password, role)) {
        // التوجه للصفحة المناسبة (نستخدم ../ للعودة للمجلد الرئيسي)
        window.location.href = (role === 'worker') ? '../kitchen.html' : '../delivery_orders.html';
    } else {
        alert("⚠️ كلمة المرور غير صحيحة");
    }
}
</script>
