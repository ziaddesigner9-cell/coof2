<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title data-key="upload_images_title">إدارة الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. تحميل المكتبة الأساسية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. تحميل الإعدادات والارتباطات -->
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/language.js"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
    <script src="../config-scripts/js_auth_config.js"></script>
    <script src="../config-scripts/js_admin.js"></script>
    <script>if (!checkAccess('admin')) location.href = "admin-login.html";</script>
</head>
<body class="bg-black text-white p-4 md:p-8 min-h-screen flex flex-col items-center relative">
    
    <div id="lang-picker-container" class="absolute top-4 right-4 z-50"></div>

    <style>
        .gold-glow {
            box-shadow: 0 0 20px rgba(245, 215, 110, 0.1);
        }
    </style>
    
    <!-- واجهة التحميل التي تظهر في البداية -->
    <div id="admin-loader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center hidden">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mx-auto"></div>
            <p class="mt-4 text-amber-500 font-bold" data-key="loading">جاري التحميل...</p>
        </div>
    </div>

    <div class="w-full max-w-4xl space-y-12">
        <a href="admin-dashboard.html" data-key="back_to_dashboard_link" class="inline-block text-amber-600 text-sm mb-4 hover:text-amber-400 transition">← العودة للوحة المدير</a>
        <div class="text-center md:text-right">
            <h1 class="text-3xl font-bold text-amber-500 mb-2" data-key="upload_images_header">مكتبة الصور</h1>
            <p class="text-zinc-500 text-sm mb-8" data-key="upload_images_desc">ارفع صور الأصناف هنا لتظهر في قائمة الاختيار</p>
        </div>

        <div class="bg-zinc-900 p-8 rounded-[2.5rem] border border-amber-500/20 shadow-2xl gold-glow max-w-md mx-auto">
            <input type="file" id="imageInput" class="hidden" accept="image/*">
            <label for="imageInput" id="dropZone" class="flex flex-col items-center justify-center w-full aspect-square border-4 border-dashed border-amber-600/20 rounded-[2rem] cursor-pointer hover:border-amber-500 hover:bg-amber-500/5 transition-all group">
                <div class="p-6 rounded-full bg-amber-500/10 mb-4 group-hover:scale-110 transition-transform">
                    <svg class="w-12 h-12 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
                <span class="text-amber-500 font-bold text-lg" data-key="click_to_select_image">اضغط لاختيار صورة</span>
                <span class="text-zinc-500 text-xs mt-2 italic font-mono" data-key="webp_conversion_hint">الصور تُحول تلقائياً لـ WebP لزيادة السرعة</span>
            </label>
            
            <div id="previewContainer" class="mt-8 hidden text-center animate-in fade-in zoom-in duration-300">
                <div class="relative inline-block">
                    <img id="imagePreview" class="w-48 h-48 object-cover rounded-3xl mx-auto border-2 border-amber-500/50 shadow-lg shadow-amber-500/10">
                    <div class="absolute -top-2 -right-2 bg-amber-500 text-black text-[10px] font-bold px-2 py-1 rounded-lg" data-key="preview_label">معاينة</div>
                </div>
                <button id="uploadBtn" data-key="upload_and_save_btn" class="w-full mt-8 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-4 rounded-2xl shadow-xl shadow-amber-600/20 transition-all active:scale-95">
                    رفع وحفظ في المكتبة ✓
                </button>
            </div>
        </div>

        <!-- قسم عرض المكتبة -->
        <div class="mt-12">
            <h2 class="text-xl font-bold text-amber-500/80 mb-6 flex items-center gap-3">
                <span class="w-8 h-1 bg-amber-500 rounded-full"></span>
                <span data-key="gallery_title">الصور المتوفرة في المكتبة</span>
            </h2>
            <div id="gallery-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 p-4 bg-zinc-900/50 rounded-[2rem] border border-amber-500/10 min-h-[200px]">
                <p class="text-zinc-500 text-center col-span-full py-10" data-key="gallery_loading_text">جاري تحميل المكتبة...</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const imageInput = document.getElementById('imageInput');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const uploadBtn = document.getElementById('uploadBtn');

            imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    imagePreview.src = URL.createObjectURL(file);
                    previewContainer.classList.remove('hidden');
                }
            });

            uploadBtn.addEventListener('click', async () => {
                console.log("0. تم الضغط على زر الرفع.");
                const file = imageInput.files[0];
                if (!file) return;

                try {
                    showAdminLoader(); // إظهار التحميل عند بدء الرفع
                    
                    // 1. الرفع إلى Storage
                    const result = await window.uploadItemImage(file);
                    
                    if (result && result.url) {
                        console.log("3. جاري حفظ البيانات في جدول gallery...");
                        // 2. الحفظ في جدول gallery (هذا هو زر "الحفظ" الذي طلبته)
                        const supabase = window.getSupabaseClient();
                        const { error: dbError } = await supabase
                            .from('gallery')
                            .insert([{ image_url: result.url, name: file.name }]);

                        console.log("4. انتهت عملية الحفظ في الجدول. النتيجة:", dbError);

                        if (dbError) throw dbError;

                        // إعادة تعيين الواجهة لرفع صورة أخرى
                        imageInput.value = ""; 
                        previewContainer.classList.add('hidden');
                        imagePreview.src = "";

                        alert(phrase(null, 'upload_success', 'تم الرفع والحفظ في المكتبة بنجاح! ✓'));

                        // تحديث قائمة الصور فوراً
                        if (typeof window.fetchGallery === "function") window.fetchGallery();
                    } else if (result && result.error) {
                        throw new Error(result.error);
                    }
                } catch (err) {
                    console.error("حدث خطأ أثناء العملية:", err);
                    alert(phrase(null, 'upload_failed', 'فشل الرفع: ') + err.message);
                } finally {
                    console.log("5. تم الوصول لنهاية الدالة وإيقاف الدوران!");
                    hideAdminLoader(); // إخفاء التحميل عند الانتهاء (حتى لو فشل)
                }
            });

            window.addEventListener("DOMContentLoaded", () => {
                if (typeof renderLanguageDropdown === "function") {
                    renderLanguageDropdown('lang-picker-container');
                }
            });

            if (window.location.search && window.location.search.indexOf('status=ready') !== -1) {
                console.log("النظام جاهز تماماً");
            }
        })();
    </script>
</body>
</html>
