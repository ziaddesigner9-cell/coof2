<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. تحميل المكتبة الأساسية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. تحميل الإعدادات والارتباطات -->
    <script src="../config-scripts/dependencies.js"></script>
    <script src="../config-scripts/js_admin.js"></script>
</head>
<body class="bg-black text-white p-6">
    
    <!-- واجهة التحميل التي تظهر في البداية -->
    <div id="admin-loader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mx-auto"></div>
            <p class="mt-4 text-amber-500 font-bold">جاري التحميل...</p>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-amber-500 mb-6">رفع صورة صنف جديد</h1>
        
        <div class="bg-zinc-900 p-6 rounded-2xl border border-amber-800/30">
            <input type="file" id="imageInput" class="hidden" accept="image/*">
            <label for="imageInput" class="block w-full border-2 border-dashed border-zinc-700 rounded-xl p-8 text-center cursor-pointer hover:border-amber-500 transition">
                <span class="text-4xl block mb-2">📸</span>
                <span class="text-sm text-zinc-400">اضغط لاختيار صورة</span>
            </label>
            
            <div id="previewContainer" class="mt-4 hidden text-center">
                <img id="imagePreview" class="w-32 h-32 object-cover rounded-xl mx-auto border border-amber-500/50">
                <button id="uploadBtn" class="w-full mt-4 bg-amber-600 text-black font-bold py-3 rounded-xl">رفع الآن</button>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const uploadBtn = document.getElementById('uploadBtn');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                previewContainer.classList.remove('hidden');
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            try {
                showAdminLoader(); // إظهار التحميل عند بدء الرفع
                const result = await window.uploadItemImage(file);
                
                if (result.url) {
                    alert('تم الرفع بنجاح!');
                    console.log("URL الصورة:", result.url);
                    // هنا يمكنك إرسال الرابط لجدول items
                }
            } catch (err) {
                alert('فشل الرفع: ' + err.message);
            } finally {
                hideAdminLoader(); // إخفاء التحميل عند الانتهاء (حتى لو فشل)
            }
        });

        // السطر 57 - التأكد من إغلاق الدوال قبل أي جملة if
        if (window.location.search.includes('status=ready')) {
            console.log("النظام جاهز تماماً");
        }
    </script>
</body>
</html>
