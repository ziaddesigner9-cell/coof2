<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title data-key="order_monitor_title">مراقبة الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config-scripts/dependencies.js?v=6"></script>
    <script src="../config-scripts/js_app_settings.js"></script>
    <script src="../config-scripts/language.js"></script>
</head>
<body class="bg-gray-100 p-8 relative">
    <div id="lang-picker-container" class="absolute top-4 right-4 z-50"></div>
    <div class="max-w-4xl mx-auto">
        <h1 data-key="live_orders_header" class="text-2xl font-bold mb-6">طلبات الزبائن الحالية</h1>
        <div id="live-orders" class="grid gap-4">
        </div>
        <a href="admin-dashboard.html" data-key="back_to_menu_dashboard" class="block mt-6 text-orange-600 underline">العودة للوحة الأصناف</a>
    </div>

    <script>
        function getClient() {
            if (window.supabase) return window.supabase;
            if (typeof window.getSupabaseClient === "function") return window.getSupabaseClient();
            return null;
        }

        async function fetchLiveOrders() {
            const client = getClient();
            if (!client) return;

            const { data, error } = await client
                .from('orders')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("خطأ أثناء تحديث شاشة المراقبة:", error.message);
                return;
            }

            const container = document.getElementById('live-orders');
            if (!container) return;
            
            const rows = Array.isArray(data) ? data : [];
            let currentLang = 'ar';
            try {
                currentLang = localStorage.getItem('coof2_userLang') || 'ar';
            } catch (_) {}
            
            container.innerHTML = rows.length ? rows.map(o => {
                const tableRaw = o.table_no ?? o.table_number ?? '---';
                const isDelivery = tableRaw.includes("توصيل");
                
                const displayName = isDelivery 
                    ? phrase(null, "delivery_order_title") 
                    : phrase(null, "table_order_title").replace("{num}", tableRaw);

                const timeString = new Date(o.created_at).toLocaleTimeString(currentLang === 'ar' ? 'ar-SA' : 'en-US', {hour: '2-digit', minute:'2-digit'});
                const orderTimeStr = phrase(null, "order_time_label").replace("{time}", timeString);

                return `
                    <div class="bg-white p-4 rounded-xl shadow border-r-4 ${isDelivery ? 'border-blue-500' : 'border-amber-500'}">
                        <p class="font-bold text-lg text-gray-800">${displayName}</p>
                        <p class="text-sm text-gray-500 mt-1">${orderTimeStr}</p>
                    </div>
                `;
            }).join('') : `
                <div class="text-center py-12 text-gray-400">
                    <p class="text-xl">${phrase(null, "no_pending_orders")}</p>
                </div>`;
        }

        function initLiveMonitor() {
            fetchLiveOrders();

            const client = getClient();
            if (client) {
                client.channel('live_monitor_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                        fetchLiveOrders();
                    })
                    .subscribe();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderLanguageDropdown === 'function') {
                renderLanguageDropdown('lang-picker-container');
            }
            if (getClient()) initLiveMonitor();
            window.addEventListener("supabaseReady", initLiveMonitor);
            
            window.addEventListener('languageChanged', () => {
                fetchLiveOrders();
            });
        });
    </script>
</body>
</html>
